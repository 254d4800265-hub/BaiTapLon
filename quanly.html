<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản Lý Chi Tiêu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Quản Lý Chi Tiêu</a>
    <div>
      <a class="btn btn-light btn-sm me-2" href="index.html">Trang chủ</a>
      <a class="btn btn-light btn-sm me-2" href="quanly.html">Quản lý</a>
      <a class="btn btn-light btn-sm" href="debug.html">Debug</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="mb-4">Nhập Khoản Chi</h2>

  <div class="card shadow p-4">
    <form id="expenseForm">
      <div class="row">
        <div class="col-md-3 mb-3">
          <label class="form-label">Tên khoản chi</label>
          <input type="text" class="form-control" id="tenChi" required>
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Số tiền</label>
          <input type="number" class="form-control" id="soTien" required>
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Loại chi phí</label>
          <select class="form-select" id="loaiChi">
            <option>Ăn uống</option>
            <option>Học tập</option>
            <option>Di chuyển</option>
            <option>Giải trí</option>
          </select>
        </div>

        <div class="col-md-3 mb-3">
          <label class="form-label">Ngày chi</label>
          <input type="date" class="form-control" id="ngayChi" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Mã số sinh viên</label>
        <input type="text" class="form-control" id="mssv" placeholder="VD: 23010001" required>
      </div>

      <button type="submit" class="btn btn-success">Thêm khoản chi</button>
    </form>
  </div>

  <div class="alert alert-warning mt-3 d-none" id="canhBao">
    Cần cân đối chi tiêu! Tổng chi đã vượt quá 1.500.000 VNĐ.
  </div>

  <div class="table-responsive mt-4">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Tên khoản chi</th>
          <th>Số tiền</th>
          <th>Loại chi phí</th>
          <th>Ngày chi</th>
        </tr>
      </thead>
      <tbody id="expenseTable"></tbody>
    </table>
  </div>
</div>

<script>
let tongChi = 0;

document.getElementById("expenseForm").addEventListener("submit", function(e){
  e.preventDefault();

  const tenChi = document.getElementById("tenChi").value;
  const soTien = parseInt(document.getElementById("soTien").value);
  const loaiChi = document.getElementById("loaiChi").value;
  const ngayChi = document.getElementById("ngayChi").value;
  const mssv = document.getElementById("mssv").value;

  const row = `
    <tr>
      <td>${tenChi}</td>
      <td>${soTien.toLocaleString()} VNĐ</td>
      <td>${loaiChi}</td>
      <td>${ngayChi}</td>
    </tr>
  `;

  const table = document.getElementById("expenseTable");

  // MSSV kết thúc bằng số lẻ -> chèn đầu bảng
  // MSSV kết thúc bằng số chẵn -> chèn cuối bảng
  const lastDigit = parseInt(mssv[mssv.length - 1]);

  if(lastDigit % 2 !== 0){
    table.insertAdjacentHTML("afterbegin", row);
  } else {
    table.insertAdjacentHTML("beforeend", row);
  }

  tongChi += soTien;

  if(tongChi > 1500000){
    document.getElementById("canhBao").classList.remove("d-none");
  }

  document.getElementById("expenseForm").reset();
});
</script>

</body>
</html>
